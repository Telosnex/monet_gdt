name: monet_gdt_libmonet_tools
description: >-
  monet GDT inputs computed by libmonet: the graph's HCT table
  (out/graph/hct_lut.f32) and the color model's rule_v1 targets
  (out/teacher_colors/rule_triads.jsonl).
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  libmonet:
    git:
      url: https://github.com/Telosnex/libmonet.git
      # Pinned to the app's libmonet: the HCT table and the triads must match
      # what the app runs (Hct, monetGdtRuleV1Triad).
      ref: c4c2cc09c5e710e5f6ead53fd6e905bd5d20b854  # monet_gdt_rule_v1

dev_dependencies:
  flutter_test:
    sdk: flutter
