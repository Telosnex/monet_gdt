name: monet_gdt_v2_labels
description: >-
  Color-head targets from monet_ui's MonetGdtRule20261030 (v2): Celebi 128 on
  telosnex's 96 px thumbnail, then the scorer's P/S/T.
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: any
  # Pinned exactly: the labels depend on this code. labels_meta.json records
  # the version and the rule file's sha256.
  monet_ui: 1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
