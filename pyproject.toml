[project]
name = "monet-gdt"
version = "0.1.0"
description = "monet_gdt: an on-device wallpaper model (mood, colors, shapes) for libmonet apps"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "timm==1.0.30",
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
  "onnxscript==0.7.2",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "open_clip_torch==3.3.0",
  "pyarrow==26.0.0",
  "huggingface_hub==2.2.0",
  "fsspec==2026.9.0",
  "scipy==1.18.1",
  "safetensors==0.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
extend-exclude = ["experiments/*/out", "experiments/*/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E731", "E741"]  # sys.path setup before imports; short lambdas; `l` for lines

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
